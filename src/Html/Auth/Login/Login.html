<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../app.css">
    <link rel="stylesheet" href="./Login.css">
</head>

<body>
    <div class="root-container">
        <div class="navbar">
            <div class="nav-left-group">
                <a href="index.html" class="logo">
                    <img src="../../Images/Logo/logo.svg" alt="Otomobil Logo" srcset="">
                </a>
                <h3>Otomobil</h3>
            </div>
            <div class="nav-buttons">
                <button class="nav-button-register" onclick="location.href='../Register.html'">Sign Up</button>
                <button class="nav-button-login" onclick="location.href='#'">Login</button>
            </div>
        </div>
        <div class="login-container">
            <div class="login-title-group">
                <h3>Welcome Back!</h3>
                <p>Please login first</p>
            </div>
            <div class="login-form-group">
                <form class="login-form" action="/submit" method="post">
                    <input type="email" id="email" email="email" placeholder="Email" required>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <p>Forgot Password? <a href="#">Click Here</a></p>
                </form>
                <button class="submit-login-btn" type="submit">
                    Login
                </button>
            </div>
            <div class="no-account-link-container">
                <p>Dont have an account? <a href="">Sign up Here</a></p>    
            </div>
        </div>
    </div>
</body>

</html>
