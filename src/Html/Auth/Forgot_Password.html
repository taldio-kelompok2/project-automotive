<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otomobil – Sign Up</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Styles -->
    <link rel="stylesheet" href="Forgot_Password.css" />
  </head>
  <body>
    <div class="page-wrap">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="brand">
          <img src="../Images/Logo/image 8.png" alt="Otomobil Logo" class="logo" />
          <span class="brand-name">Otomobil</span>
        </div>

        <nav class="nav">
          <a class="btn-signup" href="#">Sign Up</a>
          <a class="btn-login" href="#">Login</a>
        </nav>
      </header>

      <!-- Main -->
      <main class="container">
        <section class="auth-card">
          <div class="master-title">
            <h1 class="title">Reset Password</h1>
            <p class="subtitle">Send OTP code to your email address</p>
          </div>

          <form class="form">
            <div class="field">
              <input type="email" placeholder="Email" required/>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-cancel">Cancel</button>
                <button type="submit" class="btn btn-confirm">Confirm</button>
            </div>
          </form>
        </section>
      </main>

    </div>
  </body>
</html>
