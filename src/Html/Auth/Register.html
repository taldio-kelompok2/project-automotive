<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otomobil – Sign Up</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Styles -->
    <link rel="stylesheet" href="Register.css" />
  </head>
  <body>
    <div class="page-wrap">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="brand">
          <img src="../Images/Logo/image 8.png" alt="Otomobil Logo" class="logo" />
          <span class="brand-name">Otomobil</span>
        </div>

        <nav class="nav">
          <a class="btn-signup" href="#">Sign Up</a>
          <a class="btn-login" href="#">Login</a>
        </nav>
      </header>

      <!-- Main -->
      <main class="container">
        <section class="auth-card">
          <div class="master-title">
            <h1 class="title">Lets Join our couse!</h1>
            <p class="subtitle">Please register first</p>
          </div>

          <form class="form">
            <div class="field">
              <input type="text" placeholder="Name" />
            </div>
            <div class="field">
              <input type="email" placeholder="Email" />
            </div>
            <div class="field">
              <input type="password" placeholder="Password" />
            </div>
            <div class="field">
              <input type="password" placeholder="Confirm Password" />
            </div>

            <div class="actions">
              <button type="submit" class="btn btn-signup2">Sign Up</button>
            </div>
          </form>

          <p class="signin-note">
            Have account? <a href="#" class="login-link">Login here</a>
          </p>
        </section>
      </main>

    </div>
  </body>
</html>
